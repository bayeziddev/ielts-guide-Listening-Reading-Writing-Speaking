<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">IELTS tense timeline</title>
<desc id="desc">A timeline from past to present to future with examples of past simple, present perfect, present simple, present continuous, and future forms.</desc>
<rect width="1200" height="620" rx="28" fill="#f8fafc"/>
<text x="600" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b6d">Choose tense from the timeline</text>
<line x1="120" y1="180" x2="1080" y2="180" stroke="#1e40af" stroke-width="6"/><path d="M1080 180 l-24 -14 v28 z" fill="#1e40af"/>
<g font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#334155"><text x="120" y="225">Past</text><text x="575" y="225">Now</text><text x="1020" y="225">Future</text></g>
<line x1="575" y1="145" x2="575" y2="500" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10"/>
<g font-family="Arial,sans-serif">
<circle cx="280" cy="180" r="14" fill="#dc2626"/><rect x="110" y="270" width="330" height="95" rx="16" fill="#fee2e2"/><text x="275" y="307" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">Past simple</text><text x="275" y="340" text-anchor="middle" font-size="18" fill="#7f1d1d">The rate fell in 2015.</text>
<circle cx="475" cy="180" r="14" fill="#f59e0b"/><rect x="390" y="395" width="370" height="100" rx="16" fill="#fef3c7"/><text x="575" y="433" text-anchor="middle" font-size="22" font-weight="700" fill="#92400e">Present perfect</text><text x="575" y="468" text-anchor="middle" font-size="18" fill="#78350f">It has risen since 2015.</text>
<circle cx="650" cy="180" r="14" fill="#16a34a"/><rect x="600" y="270" width="330" height="95" rx="16" fill="#dcfce7"/><text x="765" y="307" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Present simple</text><text x="765" y="340" text-anchor="middle" font-size="18" fill="#166534">The chart shows a rise.</text>
<circle cx="810" cy="180" r="14" fill="#2563eb"/><rect x="785" y="395" width="320" height="100" rx="16" fill="#dbeafe"/><text x="945" y="433" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">Future</text><text x="945" y="468" text-anchor="middle" font-size="18" fill="#1e3a8a">The trend will continue.</text>
</g>
<text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Finished time → past simple | Past connected to now → present perfect | Prediction → will + base verb</text>
</svg>
