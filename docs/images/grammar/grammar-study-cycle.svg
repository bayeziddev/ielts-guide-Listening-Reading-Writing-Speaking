<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">IELTS grammar study cycle</title>
<desc id="desc">A four-step cycle for grammar learning: notice, control, communicate, and review.</desc>
<rect width="1000" height="600" rx="28" fill="#f8fafc"/>
<text x="500" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b6d">A practical grammar study cycle</text>
<circle cx="500" cy="315" r="112" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="500" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">IELTS</text><text x="500" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">grammar</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="90" y="120" width="240" height="110" rx="18" fill="#fef3c7"/><text x="210" y="162" font-size="24" font-weight="700" fill="#92400e">1. NOTICE</text><text x="210" y="198" font-size="18" fill="#78350f">underline the pattern</text>
<rect x="670" y="120" width="240" height="110" rx="18" fill="#dcfce7"/><text x="790" y="162" font-size="24" font-weight="700" fill="#166534">2. CONTROL</text><text x="790" y="198" font-size="18" fill="#166534">change one detail</text>
<rect x="670" y="425" width="240" height="110" rx="18" fill="#fce7f3"/><text x="790" y="467" font-size="24" font-weight="700" fill="#9d174d">3. COMMUNICATE</text><text x="790" y="503" font-size="18" fill="#9d174d">write or speak naturally</text>
<rect x="90" y="425" width="240" height="110" rx="18" fill="#ede9fe"/><text x="210" y="467" font-size="24" font-weight="700" fill="#5b21b6">4. REVIEW</text><text x="210" y="503" font-size="18" fill="#5b21b6">correct and repeat</text>
</g>
<g fill="none" stroke="#64748b" stroke-width="5"><path d="M330 175 C430 120 570 120 670 175"/><path d="M790 230 C875 290 875 365 790 425"/><path d="M670 480 C570 535 430 535 330 480"/><path d="M210 425 C125 365 125 290 210 230"/></g>
<g fill="#64748b"><path d="M660 173 l-18 -12 v25 z"/><path d="M790 415 l-12 -18 h25 z"/><path d="M340 480 l18 -12 v25 z"/><path d="M210 240 l-12 18 h25 z"/></g>
</svg>
