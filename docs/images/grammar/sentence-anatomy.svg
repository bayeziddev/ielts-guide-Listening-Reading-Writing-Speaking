<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Sentence anatomy for IELTS learners</title>
<desc id="desc">The sentence Public transport reduces traffic significantly is divided into subject, verb, object, and adverbial modifier.</desc>
<rect width="1200" height="520" rx="28" fill="#fffdf7"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b6d">Sentence anatomy</text>
<text x="600" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Start with the basic English order: Subject + Verb + Object + extra information</text>
<g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
<rect x="70" y="180" width="250" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="195" y="222" font-size="25" fill="#1e3a8a">Public transport</text><text x="195" y="258" font-size="18" fill="#1e3a8a">SUBJECT: who/what?</text>
<rect x="350" y="180" width="190" height="105" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="445" y="222" font-size="25" fill="#166534">reduces</text><text x="445" y="258" font-size="18" fill="#166534">VERB: what happens?</text>
<rect x="570" y="180" width="190" height="105" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="665" y="222" font-size="25" fill="#92400e">traffic</text><text x="665" y="258" font-size="18" fill="#92400e">OBJECT: what?</text>
<rect x="790" y="180" width="330" height="105" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="955" y="222" font-size="25" fill="#5b21b6">significantly</text><text x="955" y="258" font-size="18" fill="#5b21b6">MODIFIER: how much?</text>
</g>
<path d="M95 340 H1100" stroke="#94a3b8" stroke-width="4"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#334155">
<text x="100" y="390">The sentence is complete because it has a clear subject and a finite verb.</text>
<text x="100" y="428">Bengali support: কে/কী + কী করে + কাকে/কী + কীভাবে/কতটা</text>
<text x="100" y="466">IELTS check: never write “Public transport reducing traffic” as a complete sentence.</text>
</g>
</svg>
