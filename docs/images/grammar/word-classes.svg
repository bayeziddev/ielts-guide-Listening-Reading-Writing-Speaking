<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">English word classes map</title>
<desc id="desc">A central sentence connects eight word classes: noun, pronoun, verb, adjective, adverb, preposition, conjunction, and interjection.</desc>
<rect width="1200" height="650" rx="28" fill="#f8fafc"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b6d">Word classes: each word has a job</text>
<text x="600" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Ask: What job is this word doing in this sentence?</text>
<rect x="350" y="245" width="500" height="150" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="600" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">The motivated students</text>
<text x="600" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">study carefully because</text>
<text x="600" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">the exam is near.</text>
<g font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">
<rect x="55" y="145" width="190" height="78" rx="16" fill="#fef3c7"/><text x="150" y="178" fill="#92400e">Noun</text><text x="150" y="204" font-size="15" font-weight="400" fill="#78350f">names a person/thing</text>
<rect x="270" y="125" width="190" height="78" rx="16" fill="#dcfce7"/><text x="365" y="158" fill="#166534">Verb</text><text x="365" y="184" font-size="15" font-weight="400" fill="#166534">action or state</text>
<rect x="740" y="125" width="190" height="78" rx="16" fill="#fce7f3"/><text x="835" y="158" fill="#9d174d">Adjective</text><text x="835" y="184" font-size="15" font-weight="400" fill="#9d174d">describes a noun</text>
<rect x="955" y="145" width="190" height="78" rx="16" fill="#ede9fe"/><text x="1050" y="178" fill="#5b21b6">Adverb</text><text x="1050" y="204" font-size="15" font-weight="400" fill="#5b21b6">describes how/when</text>
<rect x="55" y="455" width="190" height="78" rx="16" fill="#e0f2fe"/><text x="150" y="488" fill="#075985">Pronoun</text><text x="150" y="514" font-size="15" font-weight="400" fill="#075985">replaces a noun</text>
<rect x="270" y="475" width="190" height="78" rx="16" fill="#ffedd5"/><text x="365" y="508" fill="#9a3412">Preposition</text><text x="365" y="534" font-size="15" font-weight="400" fill="#9a3412">shows a relationship</text>
<rect x="740" y="475" width="190" height="78" rx="16" fill="#f1f5f9"/><text x="835" y="508" fill="#334155">Conjunction</text><text x="835" y="534" font-size="15" font-weight="400" fill="#334155">joins ideas</text>
<rect x="955" y="455" width="190" height="78" rx="16" fill="#fee2e2"/><text x="1050" y="488" fill="#991b1b">Interjection</text><text x="1050" y="514" font-size="15" font-weight="400" fill="#991b1b">expresses reaction</text>
</g>
<g stroke="#94a3b8" stroke-width="3" fill="none"><path d="M245 184 L350 260"/><path d="M460 164 L470 245"/><path d="M740 164 L730 245"/><path d="M955 184 L850 260"/><path d="M245 494 L350 380"/><path d="M460 514 L470 395"/><path d="M740 514 L730 395"/><path d="M955 494 L850 380"/></g>
</svg>
