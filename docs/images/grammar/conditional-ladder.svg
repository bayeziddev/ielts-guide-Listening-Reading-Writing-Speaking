<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Conditional sentence ladder</title>
<desc id="desc">Four steps show zero, first, second, and third conditionals from general truth to unreal past.</desc>
<rect width="1200" height="650" rx="28" fill="#f8fafc"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b6d">Conditional sentences: condition → result</text>
<g font-family="Arial,sans-serif">
<rect x="100" y="500" width="1000" height="82" rx="16" fill="#dcfce7"/><text x="145" y="535" font-size="23" font-weight="700" fill="#166534">ZERO</text><text x="310" y="535" font-size="21" fill="#166534">general truth</text><text x="310" y="565" font-size="19" fill="#166534">If water boils, it produces steam.</text>
<rect x="200" y="380" width="900" height="82" rx="16" fill="#dbeafe"/><text x="245" y="415" font-size="23" font-weight="700" fill="#1e3a8a">FIRST</text><text x="410" y="415" font-size="21" fill="#1e3a8a">real possibility</text><text x="410" y="445" font-size="19" fill="#1e3a8a">If cities invest, congestion will fall.</text>
<rect x="300" y="260" width="800" height="82" rx="16" fill="#fef3c7"/><text x="345" y="295" font-size="23" font-weight="700" fill="#92400e">SECOND</text><text x="535" y="295" font-size="21" fill="#92400e">imaginary now/future</text><text x="535" y="325" font-size="19" fill="#92400e">If I were mayor, I would improve buses.</text>
<rect x="400" y="140" width="700" height="82" rx="16" fill="#fee2e2"/><text x="445" y="175" font-size="23" font-weight="700" fill="#991b1b">THIRD</text><text x="610" y="175" font-size="21" fill="#991b1b">unreal past</text><text x="610" y="205" font-size="19" fill="#991b1b">If they had planned, they would have avoided delays.</text>
</g>
<path d="M175 500 L175 462" stroke="#64748b" stroke-width="5"/><path d="M275 380 L275 342" stroke="#64748b" stroke-width="5"/><path d="M375 260 L375 222" stroke="#64748b" stroke-width="5"/>
<text x="600" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569">As you climb, the situation becomes less real or less possible. Never put “will” directly after if in a normal first conditional.</text>
</svg>
