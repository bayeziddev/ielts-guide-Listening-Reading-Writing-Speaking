<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">IELTS Speaking answer ladder</title><desc id="desc">A speaking answer grows from direct answer to reason, example, and result.</desc><rect width="1000" height="430" rx="28" fill="#F5F6F3"/><text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1F3A5F">Speaking: develop every answer</text><g font-family="Arial,sans-serif"><path d="M100 350h190v-65h190v-65h190v-65h190" fill="none" stroke="#7A6A53" stroke-width="12" stroke-linejoin="round"/><g text-anchor="middle"><text x="190" y="325" font-size="22" font-weight="700" fill="#1F3A5F">Answer</text><text x="190" y="350" font-size="16" fill="#4B5768">Yes, I do.</text><text x="380" y="260" font-size="22" font-weight="700" fill="#1F3A5F">Reason</text><text x="380" y="285" font-size="16" fill="#4B5768">because it relaxes me</text><text x="570" y="195" font-size="22" font-weight="700" fill="#1F3A5F">Example</text><text x="570" y="220" font-size="16" fill="#4B5768">especially after work</text><text x="760" y="130" font-size="22" font-weight="700" fill="#1F3A5F">Result</text><text x="760" y="155" font-size="16" fill="#4B5768">so I sleep better</text></g><circle cx="100" cy="350" r="18" fill="#1F3A5F"/><circle cx="290" cy="285" r="18" fill="#1F3A5F"/><circle cx="480" cy="220" r="18" fill="#1F3A5F"/><circle cx="670" cy="155" r="18" fill="#1F3A5F"/></g><text x="500" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#4B5768">Natural development is better than memorising a long answer.</text></svg>
