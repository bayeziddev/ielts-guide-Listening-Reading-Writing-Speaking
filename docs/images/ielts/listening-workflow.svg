<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">IELTS Listening workflow</title><desc id="desc">Four steps: read and predict, listen for meaning, write the answer, check spelling and grammar.</desc><rect width="1200" height="420" rx="28" fill="#F5F6F3"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1F3A5F">Listening: a four-step answer cycle</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(70 120)"><rect width="240" height="190" rx="20" fill="#E7ECF3" stroke="#1F3A5F" stroke-width="3"/><circle cx="120" cy="52" r="26" fill="#1F3A5F"/><text x="120" y="61" font-size="24" font-weight="700" fill="white">1</text><text x="120" y="110" font-size="22" font-weight="700" fill="#1F3A5F">Read &amp; predict</text><text x="120" y="145" font-size="17" fill="#4B5768">word type, number,</text><text x="120" y="169" font-size="17" fill="#4B5768">or likely synonym</text></g><path d="M330 215h55" stroke="#7A6A53" stroke-width="8"/><path d="m375 195 28 20-28 20" fill="none" stroke="#7A6A53" stroke-width="8"/><g transform="translate(410 120)"><rect width="240" height="190" rx="20" fill="#EFEAE0" stroke="#7A6A53" stroke-width="3"/><circle cx="120" cy="52" r="26" fill="#7A6A53"/><text x="120" y="61" font-size="24" font-weight="700" fill="white">2</text><text x="120" y="110" font-size="22" font-weight="700" fill="#1F3A5F">Listen</text><text x="120" y="145" font-size="17" fill="#4B5768">meaning, change,</text><text x="120" y="169" font-size="17" fill="#4B5768">and distractors</text></g><path d="M670 215h55" stroke="#7A6A53" stroke-width="8"/><path d="m715 195 28 20-28 20" fill="none" stroke="#7A6A53" stroke-width="8"/><g transform="translate(750 120)"><rect width="240" height="190" rx="20" fill="#E7ECF3" stroke="#1F3A5F" stroke-width="3"/><circle cx="120" cy="52" r="26" fill="#1F3A5F"/><text x="120" y="61" font-size="24" font-weight="700" fill="white">3</text><text x="120" y="110" font-size="22" font-weight="700" fill="#1F3A5F">Write</text><text x="120" y="145" font-size="17" fill="#4B5768">exact answer</text><text x="120" y="169" font-size="17" fill="#4B5768">within word limit</text></g><path d="M1010 215h55" stroke="#7A6A53" stroke-width="8"/><path d="m1055 195 28 20-28 20" fill="none" stroke="#7A6A53" stroke-width="8"/><g transform="translate(1090 120)"><rect width="90" height="190" rx="20" fill="#EFEAE0" stroke="#7A6A53" stroke-width="3"/><text x="45" y="74" font-size="20" font-weight="700" fill="#1F3A5F">4</text><text x="45" y="110" font-size="16" font-weight="700" fill="#1F3A5F">Check</text><text x="45" y="140" font-size="14" fill="#4B5768">spelling</text><text x="45" y="161" font-size="14" fill="#4B5768">grammar</text></g></g></svg> 
