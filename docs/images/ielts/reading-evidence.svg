<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">IELTS Reading evidence path</title><desc id="desc">Question, keyword or paraphrase, text location, exact evidence, and checked answer.</desc><rect width="1200" height="400" rx="28" fill="#F5F6F3"/><text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1F3A5F">Reading: never guess without evidence</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(45 115)"><rect width="190" height="180" rx="18" fill="#E7ECF3" stroke="#1F3A5F" stroke-width="3"/><text x="95" y="62" font-size="22" font-weight="700" fill="#1F3A5F">Question</text><text x="95" y="105" font-size="16" fill="#4B5768">What exactly</text><text x="95" y="130" font-size="16" fill="#4B5768">must be found?</text></g><g transform="translate(265 115)"><rect width="190" height="180" rx="18" fill="#EFEAE0" stroke="#7A6A53" stroke-width="3"/><text x="95" y="62" font-size="21" font-weight="700" fill="#1F3A5F">Key idea</text><text x="95" y="105" font-size="16" fill="#4B5768">keyword or</text><text x="95" y="130" font-size="16" fill="#4B5768">paraphrase</text></g><g transform="translate(485 115)"><rect width="190" height="180" rx="18" fill="#E7ECF3" stroke="#1F3A5F" stroke-width="3"/><text x="95" y="62" font-size="21" font-weight="700" fill="#1F3A5F">Locate</text><text x="95" y="105" font-size="16" fill="#4B5768">paragraph,</text><text x="95" y="130" font-size="16" fill="#4B5768">name, or date</text></g><g transform="translate(705 115)"><rect width="190" height="180" rx="18" fill="#EFEAE0" stroke="#7A6A53" stroke-width="3"/><text x="95" y="62" font-size="21" font-weight="700" fill="#1F3A5F">Evidence</text><text x="95" y="105" font-size="16" fill="#4B5768">read the full</text><text x="95" y="130" font-size="16" fill="#4B5768">sentence</text></g><g transform="translate(925 115)"><rect width="190" height="180" rx="18" fill="#E7ECF3" stroke="#1F3A5F" stroke-width="3"/><text x="95" y="62" font-size="21" font-weight="700" fill="#1F3A5F">Check</text><text x="95" y="105" font-size="16" fill="#4B5768">meaning, form,</text><text x="95" y="130" font-size="16" fill="#4B5768">and word limit</text></g><path d="M235 205h25M455 205h25M675 205h25M895 205h25" stroke="#7A6A53" stroke-width="7"/><path d="m250 188 24 17-24 17M470 188l24 17-24 17M690 188l24 17-24 17M910 188l24 17-24 17" fill="none" stroke="#7A6A53" stroke-width="7"/></g></svg>
