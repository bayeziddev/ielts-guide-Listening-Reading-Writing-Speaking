<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">IELTS Writing paragraph structure</title><desc id="desc">A paragraph contains a topic sentence, explanation, example, and link to the question.</desc><rect width="1200" height="420" rx="28" fill="#F5F6F3"/><text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1F3A5F">Writing: build one clear paragraph</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(55 120)"><rect width="245" height="190" rx="20" fill="#E7ECF3" stroke="#1F3A5F" stroke-width="3"/><text x="122" y="68" font-size="22" font-weight="700" fill="#1F3A5F">1. Main idea</text><text x="122" y="112" font-size="16" fill="#4B5768">topic sentence</text><text x="122" y="140" font-size="16" fill="#4B5768">answers the question</text></g><g transform="translate(325 120)"><rect width="245" height="190" rx="20" fill="#EFEAE0" stroke="#7A6A53" stroke-width="3"/><text x="122" y="68" font-size="22" font-weight="700" fill="#1F3A5F">2. Explain</text><text x="122" y="112" font-size="16" fill="#4B5768">why it matters</text><text x="122" y="140" font-size="16" fill="#4B5768">cause or result</text></g><g transform="translate(595 120)"><rect width="245" height="190" rx="20" fill="#E7ECF3" stroke="#1F3A5F" stroke-width="3"/><text x="122" y="68" font-size="22" font-weight="700" fill="#1F3A5F">3. Example</text><text x="122" y="112" font-size="16" fill="#4B5768">specific evidence</text><text x="122" y="140" font-size="16" fill="#4B5768">makes it concrete</text></g><g transform="translate(865 120)"><rect width="245" height="190" rx="20" fill="#EFEAE0" stroke="#7A6A53" stroke-width="3"/><text x="122" y="68" font-size="22" font-weight="700" fill="#1F3A5F">4. Link</text><text x="122" y="112" font-size="16" fill="#4B5768">connects back</text><text x="122" y="140" font-size="16" fill="#4B5768">to the task</text></g><path d="M300 215h25M570 215h25M840 215h25" stroke="#7A6A53" stroke-width="7"/><path d="m315 198 24 17-24 17M585 198l24 17-24 17M855 198l24 17-24 17" fill="none" stroke="#7A6A53" stroke-width="7"/></g></svg>
